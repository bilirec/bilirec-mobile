name: Build Nightly APK with bilirec SO

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Repository that produced the bilirec Android libraries
        required: true
        type: string
      source_run_id:
        description: GitHub Actions run ID containing the bilirec Android artifacts
        required: true
        type: string
      source_sha:
        description: Source commit SHA for the bilirec build
        required: true
        type: string
      source_ref:
        description: Source ref for the bilirec build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-nightly-apk-${{ inputs.source_repository }}-${{ inputs.source_sha }}
  cancel-in-progress: true

jobs:
  build-nightly-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_REF: ${{ inputs.source_ref }}

    steps:
      - name: Validate source metadata
        shell: bash
        run: |
          set -euo pipefail

          if [ "$SOURCE_REPOSITORY" != "bilirec/bilirec" ]; then
            echo "::error::Only bilirec/bilirec may trigger this workflow."
            exit 1
          fi

          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::source_run_id must contain only digits."
            exit 1
          fi

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::source_sha must be a 40-character commit SHA."
            exit 1
          fi

          if [ -z "$SOURCE_REF" ]; then
            echo "::error::source_ref must not be empty."
            exit 1
          fi

          echo "Source repository: $SOURCE_REPOSITORY"
          echo "Source run ID: $SOURCE_RUN_ID"
          echo "Source SHA: $SOURCE_SHA"
          echo "Source ref: $SOURCE_REF"

      - name: Checkout mobile repository
        uses: actions/checkout@v6
        with:
          lfs: true
          ref: master

      - name: Download arm64-v8a bilirec library
        uses: actions/download-artifact@v6
        with:
          name: bilirec-android-arm64-v8a
          path: .tmp/bilirec-so/arm64-v8a
          repository: ${{ inputs.source_repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.BILIREC_CROSS_REPO_TOKEN }}

      - name: Download x86_64 bilirec library
        uses: actions/download-artifact@v6
        with:
          name: bilirec-android-x86_64
          path: .tmp/bilirec-so/x86_64
          repository: ${{ inputs.source_repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.BILIREC_CROSS_REPO_TOKEN }}

      - name: Replace bilirec shared libraries
        shell: bash
        run: |
          set -euo pipefail

          arm64_source=".tmp/bilirec-so/arm64-v8a/libbilirec-android-arm64-v8a.so"
          x86_64_source=".tmp/bilirec-so/x86_64/libbilirec-android-x86_64.so"
          arm64_target="android/app/src/main/jniLibs/arm64-v8a/libbilirec.so"
          x86_64_target="android/app/src/main/jniLibs/x86_64/libbilirec.so"

          if [ ! -s "$arm64_source" ]; then
            echo "::error::arm64-v8a bilirec .so artifact is missing or empty."
            exit 1
          fi

          if [ ! -s "$x86_64_source" ]; then
            echo "::error::x86_64 bilirec .so artifact is missing or empty."
            exit 1
          fi

          cp -f "$arm64_source" "$arm64_target"
          cp -f "$x86_64_source" "$x86_64_target"

          echo "Replaced $arm64_target"
          echo "Replaced $x86_64_target"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android NDK r28
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          local-cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Decode Keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-key.jks

      - name: Create key.properties
        shell: bash
        run: |
          set -euo pipefail
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release-key.jks
          EOF

      - name: Prepare build version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")

          if [ -z "$TAG" ]; then
            TAG="1.0.0"
          fi

          TAG="${TAG#v}"
          TAG="${TAG#V}"
          if ! echo "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Release tag 格式必須為 vX.Y.Z，實際為：$TAG"
            exit 1
          fi

          echo "build_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build Nightly APK
        run: flutter build apk --release --build-name="${{ steps.version.outputs.build_name }}" --build-number=${{ github.run_number }}

      - name: Rename APK for artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail

          apk_name="bilirec-nightly-${SOURCE_SHA:0:12}.apk"
          apk_path="build/app/outputs/flutter-apk/$apk_name"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk_path"

          echo "name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload nightly APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilirec-nightly-apk-${{ inputs.source_sha }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 30
